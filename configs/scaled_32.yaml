experiment:
  seed: 42

model:
  variant: scaled
  depth: 32

training:
  epochs: 200
  batch_size: 128
  num_workers: 4
  pin_memory: true
  log_interval: 50

optimizer:
  name: sgd
  lr: 0.1
  weight_decay: 0.0005    # 5x stronger than d8 — deeper networks overfit more on CIFAR-10
  momentum: 0.9
  nesterov: false

scheduler:
  name: step
  milestones: [100, 150]
  gamma: 0.1

augmentation:
  random_crop: true
  random_flip: true

logging:
  save_every_n_epochs: 0

gradient_tracking:
  enabled: true
