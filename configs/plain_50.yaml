experiment:
  seed: 42

model:
  variant: no_residual    # paper section 6.2.2: y = F(x) — no skip connection
  depth: 50               # 50-layer configuration (degradation-problem deepest tier)

training:
  epochs: 200             # paper section 6.2.4: 200 epochs
  batch_size: 128         # TODO: team to verify — not specified in paper
  num_workers: 4          # TODO: team to verify — not specified in paper
  pin_memory: true        # TODO: team to verify — not specified in paper
  log_interval: 50        # TODO: team to verify — not specified in paper

optimizer:
  name: sgd               # paper section 6.2.4: SGD
  lr: 0.1                 # paper section 6.2.4: base lr = 0.1
  weight_decay: 0.0001    # paper section 6.2.4: weight decay = 1e-4
  momentum: 0.9           # paper section 6.2.4: momentum = 0.9
  nesterov: false         # TODO: team to verify — not specified in paper

scheduler:
  name: step              # paper section 6.2.4: StepLR
  milestones: [100, 150]  # paper section 6.2.4: drop at epochs 100 and 150
  gamma: 0.1              # paper section 6.2.4: divide lr by 10 at each milestone

augmentation:
  random_crop: true       # paper section 6.2.4: random crop (pad by 4)
  random_flip: true       # paper section 6.2.4: random horizontal flip

logging:
  save_every_n_epochs: 0  # TODO: team to verify — not specified in paper

gradient_tracking:
  enabled: true           # paper section 6.2.5: record L2 gradient norms every epoch
